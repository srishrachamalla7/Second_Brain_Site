<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Locked</title>
<style>
:root{
  --bg:#faf9f7; --fg:#1c1b19; --muted:#6b6862; --line:#e2ded7;
  --key:#fff; --key-press:#eceae5; --bad:#b4342a; --ok:#2f7d4f;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#141311; --fg:#f0ede8; --muted:#8d8880; --line:#2c2a26;
  --key:#1e1c19; --key-press:#2c2a26; --bad:#e0685c; --ok:#5fb37f;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid; place-items:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.lock{width:100%;max-width:320px;text-align:center}
h1{font-size:1.05rem;font-weight:600;margin:0 0 4px}
p.sub{color:var(--muted);font-size:.85rem;margin:0 0 28px}

.dots{display:flex;gap:14px;justify-content:center;margin-bottom:28px;height:16px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);transition:.15s}
.dot.on{background:var(--fg);border-color:var(--fg)}
.shake{animation:sh .4s}
@keyframes sh{
  10%,90%{transform:translateX(-2px)} 30%,70%{transform:translateX(5px)}
  50%{transform:translateX(-7px)}
}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button{
  font:inherit;font-size:1.5rem;color:var(--fg);background:var(--key);
  border:1px solid var(--line);border-radius:14px;
  height:64px;cursor:pointer;transition:background .1s;
  display:grid;place-items:center;
}
button:active{background:var(--key-press)}
button.wide{grid-column:span 1;font-size:.9rem;color:var(--muted)}
button.blank{visibility:hidden}
.msg{min-height:20px;margin-top:20px;font-size:.82rem;color:var(--muted)}
.msg.err{color:var(--bad)}
@media (max-height:560px){ button{height:52px} p.sub{margin-bottom:18px} }
</style>
</head>

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const dots = [...document.querySelectorAll('.dot')];
const msg  = document.getElementById('msg');
const lock = document.getElementById('lock');
const frame= document.getElementById('frame');
let pin = '', busy = false;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function paint(){ dots.forEach((d,i)=> d.classList.toggle('on', i < pin.length)); }

function wrong(){
  msg.textContent = 'Wrong PIN';
  msg.classList.add('err');
  document.getElementById('dots').classList.add('shake');
  setTimeout(()=>document.getElementById('dots').classList.remove('shake'), 400);
  pin=''; paint();
}

async function unlock(){
  busy = true;
  msg.classList.remove('err');
  msg.textContent = 'Unlocking…';
  try{
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']
    );
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(P.iv) }, key, b64(P.ct)
    );
    const html = new TextDecoder().decode(plain);
    lock.style.display = 'none';
    frame.style.display = 'block';
    frame.srcdoc = html;
    document.title = P.title || 'Graph';
  }catch(e){
    wrong();
  }finally{
    busy = false;
    if(msg.textContent === 'Unlocking…') msg.textContent = '';
  }
}

function press(k){
  if(busy) return;
  if(k === 'del'){ pin = pin.slice(0,-1); msg.textContent=''; msg.classList.remove('err'); paint(); return; }
  if(pin.length >= 4) return;
  pin += k; paint();
  if(pin.length === 4) unlock();
}

document.getElementById('pad').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if(b) press(b.dataset.k);
});

addEventListener('keydown', e => {
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key === 'Backspace') press('del');
});
</script>
</body>
</html>
