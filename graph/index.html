<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain — Graph</title>
<style>
:root{
  --bg:#FAF7F2; --panel:#FFFFFF; --line:#E3DCD1; --ink:#1F1A15; --muted:#7A6E60;
  --edge:#CFC5B6; --edge-hot:#C25E2A;
  --org:#C25E2A; --project:#6E7B39; --person:#A8524B; --meeting:#8A7460;
  --decision:#8C3B2E; --idea:#C99A2E; --money:#4F6B54; --other:#9A8F80;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15120E; --panel:#1D1915; --line:#302921; --ink:#F2EBE0; --muted:#9A8D7C;
  --edge:#3A3128; --edge-hot:#E0834A;
  --org:#E0834A; --project:#9BAB58; --person:#D0766C; --meeting:#B2977C;
  --decision:#D45A45; --idea:#E3B84D; --money:#78A07F; --other:#8B8073;
}}
[data-theme="dark"]{
  --bg:#15120E; --panel:#1D1915; --line:#302921; --ink:#F2EBE0; --muted:#9A8D7C;
  --edge:#3A3128; --edge-hot:#E0834A;
  --org:#E0834A; --project:#9BAB58; --person:#D0766C; --meeting:#B2977C;
  --decision:#D45A45; --idea:#E3B84D; --money:#78A07F; --other:#8B8073;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0}
canvas{display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}

.bar{
  position:fixed;top:16px;left:16px;right:16px;z-index:10;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;
}
.bar>*{pointer-events:auto}
.brand{
  font-weight:640;letter-spacing:-.01em;padding:8px 14px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
}
.brand small{color:var(--muted);font-weight:450;margin-left:8px}
input[type=search]{
  flex:1;min-width:180px;max-width:340px;padding:9px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;
}
input[type=search]:focus{outline:2px solid var(--org);outline-offset:-1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);cursor:pointer;
  font:500 12.5px/1 inherit;display:flex;align-items:center;gap:6px;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.on{color:var(--ink);border-color:currentColor}
.chip:hover{border-color:var(--muted)}

.card{
  position:fixed;right:16px;bottom:16px;width:340px;max-height:56vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;z-index:10;display:none;
  box-shadow:0 12px 32px rgba(0,0,0,.10);
}
.card.on{display:block}
.card h2{font-size:17px;letter-spacing:-.01em;margin-bottom:4px;padding-right:26px}
.card .sum{font-size:13.5px;color:var(--muted);margin:6px 0 2px;line-height:1.5}
.card .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.card code{
  display:block;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
  color:var(--muted);margin:10px 0 14px;word-break:break-all;
}
.card h3{
  font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:14px 0 6px;
}
.card ul{list-style:none}
.card li{padding:3px 0;font-size:13.5px}
.card li b{font-weight:600;color:var(--muted);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.card a{color:var(--org);text-decoration:none;cursor:pointer}
.card a:hover{text-decoration:underline}
.close{position:absolute;top:14px;right:16px;border:0;background:none;
  color:var(--muted);font-size:19px;cursor:pointer;line-height:1}

.hint{
  position:fixed;left:16px;bottom:16px;color:var(--muted);font-size:12px;z-index:10;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
}
@media (max-width:760px){
  .bar{top:10px;left:10px;right:10px;gap:8px}
  .brand{font-size:14px;padding:7px 11px;flex:1 1 100%}
  input[type=search]{max-width:none;flex:1 1 100%}
  .chips{flex:1 1 100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 12px}
  .card{left:10px;right:10px;bottom:10px;width:auto;max-height:46vh;
    padding:16px 18px 18px;border-radius:16px}
  .close{top:12px;right:14px;font-size:26px;padding:2px 8px}
  .hint{display:none}
}
@media (max-width:400px){ .brand small{display:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="bar">
  <div class="brand">Second Brain <small id="count"></small></div>
  <input type="search" id="q" placeholder="Search notes…" autocomplete="off">
  <div class="chips" id="chips"></div>
  <button class="chip" id="fit" title="fit to screen">fit</button>
</div>

<div class="card" id="card">
  <button class="close" id="x">&times;</button>
  <div class="kind" id="k"></div>
  <h2 id="t"></h2>
  <p class="sum" id="s"></p>
  <code id="p"></code>
  <div id="rels"></div>
</div>

<div class="hint">drag to pan · scroll to zoom · click a dot · press F to fit</div>

<script>
const G = JSON.parse(document.getElementById('data').textContent);
const css = k => getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
const TYPE_COLOR = t => css(['org','project','person','meeting','decision','idea','money'].includes(t)?t:'other');

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;

const nodes = G.nodes.map((n,i)=>({
  ...n,
  x: Math.cos(i*2.399)*Math.sqrt(i)*34,
  y: Math.sin(i*2.399)*Math.sqrt(i)*34,
  vx:0, vy:0, deg:0
}));
const byId = new Map(nodes.map(n=>[n.id,n]));
const links = G.edges
  .filter(e=>byId.has(e.from)&&byId.has(e.to)&&e.from!==e.to)
  .map(e=>({s:byId.get(e.from), t:byId.get(e.to), rel:e.rel}));
links.forEach(l=>{l.s.deg++; l.t.deg++});

const radius = n => 5 + Math.min(11, Math.sqrt(n.deg)*3.1);

// ---- view
let view={x:0,y:0,k:1}, drag=null, dragNode=null, hover=null, selected=null;
let filter=new Set(), query='';

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  // clientWidth/clientHeight are read-only — the CSS size must be set explicitly,
  // or the canvas renders at DPR times its intended size.
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function fitView(pad){
  if(!nodes.length) return;
  const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const m = pad === undefined ? (W < 620 ? 54 : 90) : pad;
  const k = Math.min(4, Math.max(.15,
    Math.min((W-m*2)/Math.max(1,x1-x0), (H-m*2-(W<620?120:0))/Math.max(1,y1-y0))));
  view.k = k;
  view.x = W/2 - ((x0+x1)/2)*k;
  view.y = (W<620 ? (H+70)/2 : H/2) - ((y0+y1)/2)*k;
}

let touched = false, fitted = false;
addEventListener('resize', ()=>{ resize(); if(!touched) fitView(); });
resize();
view.x = W/2; view.y = H/2;

// ---- physics
let alpha = 1;
function tick(){
  if(alpha > .004){
    alpha *= .992;
    const k = alpha;
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      a.vx -= a.x*0.0022*k*40; a.vy -= a.y*0.0022*k*40;      // gravity to centre
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy||1;
        if(d2 > 90000) continue;
        const f = 900*k/d2;
        dx*=f; dy*=f;
        a.vx-=dx; a.vy-=dy; b.vx+=dx; b.vy+=dy;               // repulsion
      }
    }
    for(const l of links){
      let dx=l.t.x-l.s.x, dy=l.t.y-l.s.y;
      const d=Math.hypot(dx,dy)||1, f=(d-110)*0.035*k;
      dx=dx/d*f; dy=dy/d*f;
      l.s.vx+=dx; l.s.vy+=dy; l.t.vx-=dx; l.t.vy-=dy;         // springs
    }
    for(const n of nodes){
      if(n===dragNode) continue;
      n.x+=n.vx*=.82; n.y+=n.vy*=.82;
    }
  }
  // keep the whole graph framed while it settles, until the user takes over
  if(!touched) fitView();
  draw();
  requestAnimationFrame(tick);
}

const visible = n =>
  (!filter.size || filter.has(n.type)) &&
  (!query || (n.title+' '+n.id+' '+(n.tags||[]).join(' ')).toLowerCase().includes(query));

const neighbours = n => {
  const s=new Set();
  if(!n) return s;
  links.forEach(l=>{ if(l.s===n) s.add(l.t); if(l.t===n) s.add(l.s); });
  return s;
};

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);

  const focus = selected || hover;
  const near = neighbours(focus);

  ctx.lineWidth = 1/view.k;
  for(const l of links){
    const on = focus && (l.s===focus||l.t===focus);
    if(!visible(l.s) && !visible(l.t)) continue;
    ctx.strokeStyle = on ? css('edge-hot') : css('edge');
    ctx.globalAlpha = focus ? (on?.95:.16) : .55;
    ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y); ctx.stroke();
  }

  ctx.globalAlpha = 1;
  for(const n of nodes){
    const vis = visible(n);
    const dim = (focus && n!==focus && !near.has(n)) || !vis;
    const r = radius(n);
    ctx.globalAlpha = dim ? .2 : 1;
    ctx.fillStyle = TYPE_COLOR(n.type);
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.284); ctx.fill();
    if(n===focus){
      ctx.strokeStyle=css('ink'); ctx.lineWidth=2/view.k;
      ctx.beginPath(); ctx.arc(n.x,n.y,r+3.5,0,6.284); ctx.stroke();
    }
    if(!dim && (view.k>.62 || n.deg>3 || n===focus)){
      ctx.globalAlpha = dim?.2:.9;
      ctx.fillStyle = css('ink');
      ctx.font = `${n===focus?600:450} ${11.5/view.k}px ui-sans-serif,system-ui,sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(n.title.length>30?n.title.slice(0,29)+'…':n.title, n.x, n.y+r+13/view.k);
    }
  }
  ctx.restore();
}

// ---- hit testing
const toWorld = (px,py)=>({x:(px-view.x)/view.k, y:(py-view.y)/view.k});
function pick(px,py){
  const p = toWorld(px,py);
  let best=null, bd=Infinity;
  for(const n of nodes){
    if(!visible(n)) continue;
    const d=Math.hypot(n.x-p.x,n.y-p.y);
    if(d < radius(n) + (COARSE ? 18 : 7) && d < bd){ best=n; bd=d; }
  }
  return best;
}

// pointer events cover mouse, touch and pen with one code path
const pointers = new Map();
let pinch = null, moved = 0;
const COARSE = matchMedia('(pointer:coarse)').matches;

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  touched = true;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  moved = 0;

  if(pointers.size === 2){
    dragNode = null; drag = null;
    const [a,b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), k: view.k,
              cx:(a.x+b.x)/2, cy:(a.y+b.y)/2,
              vx:view.x, vy:view.y };
    return;
  }

  const n = pick(e.clientX, e.clientY);
  if(n && !COARSE){ dragNode = n; }
  else { drag = {x:e.clientX-view.x, y:e.clientY-view.y}; canvas.classList.add('drag'); }
});

canvas.addEventListener('pointermove', e=>{
  const prev = pointers.get(e.pointerId);
  if(prev){
    moved += Math.hypot(e.clientX-prev.x, e.clientY-prev.y);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }

  if(pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const k = Math.max(.15, Math.min(4, pinch.k * (d/pinch.d)));
    view.x = pinch.cx - (pinch.cx - pinch.vx) * (k/pinch.k);
    view.y = pinch.cy - (pinch.cy - pinch.vy) * (k/pinch.k);
    view.k = k;
    return;
  }

  if(dragNode){
    const p = toWorld(e.clientX, e.clientY);
    dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = dragNode.vy = 0;
    alpha = Math.max(alpha, .18);
  } else if(drag){
    view.x = e.clientX - drag.x; view.y = e.clientY - drag.y;
  } else if(!COARSE){
    const n = pick(e.clientX, e.clientY);
    if(n !== hover){ hover = n; canvas.style.cursor = n ? 'pointer' : 'grab'; }
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size === 0){
    // a tap, not a drag — treat it as a click on whatever is under the finger
    if(moved < 9) select(pick(e.clientX, e.clientY));
    drag = null; dragNode = null; canvas.classList.remove('drag');
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  touched = true;
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  const k = Math.max(.15, Math.min(4, view.k*f));
  view.x = e.clientX - (e.clientX-view.x)*(k/view.k);
  view.y = e.clientY - (e.clientY-view.y)*(k/view.k);
  view.k = k;
}, {passive:false});

// ---- side card
const card=document.getElementById('card');
function select(n){
  selected=n;
  if(!n){ card.classList.remove('on'); return; }
  document.getElementById('k').textContent = n.type + (n.status?' · '+n.status:'');
  document.getElementById('t').textContent = n.title;
  const sum = document.getElementById('s');
  sum.textContent = n.summary || '';
  sum.style.display = n.summary ? 'block' : 'none';
  document.getElementById('p').textContent = n.path;

  const out=[], inn=[];
  links.forEach(l=>{
    if(l.s===n) out.push([l.rel,l.t]);
    if(l.t===n) inn.push([l.rel,l.s]);
  });
  const list = (label,arr) => !arr.length ? '' :
    `<h3>${label} (${arr.length})</h3><ul>` + arr.map(([rel,m])=>
      `<li><b>${rel}</b><a data-go="${m.id}">${m.title}</a></li>`).join('') + `</ul>`;

  document.getElementById('rels').innerHTML = list('links out',out)+list('linked from',inn)
    || '<h3>no links yet</h3>';
  card.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{
    const m=byId.get(a.dataset.go);
    if(m){ select(m); view.x=W/2-m.x*view.k; view.y=H/2-m.y*view.k; }
  });
  card.classList.add('on');
}
document.getElementById('x').onclick=()=>select(null);

// ---- chips + search
const types=[...new Set(nodes.map(n=>n.type))].sort();
document.getElementById('chips').innerHTML = types.map(t=>{
  const c=nodes.filter(n=>n.type===t).length;
  return `<button class="chip" data-t="${t}" style="color:${TYPE_COLOR(t)}">
    <span class="dot"></span>${t} ${c}</button>`;
}).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const t=b.dataset.t;
  filter.has(t)?filter.delete(t):filter.add(t);
  b.classList.toggle('on');
});
document.getElementById('q').oninput=e=>{ query=e.target.value.trim().toLowerCase(); };
document.getElementById('count').textContent =
  `${G.counts.notes} notes · ${G.counts.edges} links`;
addEventListener('keydown',e=>{
  if(e.key==='Escape') select(null);
  if(e.key==='f' || e.key==='0'){ touched=false; fitView(); }
});
document.getElementById('fit').onclick = ()=>{ touched=false; fitView(); select(null); };
canvas.addEventListener('dblclick', ()=>{ touched=false; fitView(); });

tick();
</script>
</body>
</html>
